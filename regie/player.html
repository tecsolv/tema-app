<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeMa Display Player</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#000; overflow:hidden;
      width:100vw; height:100vh;
      font-family:sans-serif; cursor:none;
    }
    .slide {
      position:absolute; inset:0; opacity:0;
      transition:opacity 0.9s ease-in-out;
      display:flex; align-items:center; justify-content:center;
      background:#000;
    }
    .slide.active { opacity:1; }
    .slide img, .slide video { width:100vw; height:100vh; object-fit:cover; }

    #progress-bar {
      position:fixed; bottom:0; left:0; height:3px; width:0%;
      background:#C8981A; z-index:200; transition:width linear;
    }
    #offline-badge {
      position:fixed; top:16px; right:16px;
      background:rgba(200,50,0,0.85); color:#fff;
      font-size:12px; font-weight:600; padding:6px 14px;
      border-radius:6px; z-index:300; display:none; letter-spacing:0.04em;
    }
    #empty-state {
      display:none; position:fixed; inset:0; background:#0D0D0D;
      flex-direction:column; align-items:center; justify-content:center;
      gap:16px; color:rgba(255,255,255,0.25);
    }
    #empty-state.visible { display:flex; }
    .empty-logo { font-size:40px; font-weight:800; letter-spacing:-1px; color:#C8981A; opacity:0.6; }
    .empty-logo span { color:#1A7A6E; }
    .empty-msg { font-size:15px; letter-spacing:0.06em; text-transform:uppercase; }
    .empty-sub { font-size:11px; opacity:0.5; }
    #debug {
      position:fixed; bottom:10px; left:12px;
      font-size:10px; color:rgba(255,255,255,0.15);
      font-family:monospace; z-index:200; pointer-events:none;
    }
    #emergency-overlay {
      display:none; position:fixed; inset:0; z-index:9999;
      align-items:center; justify-content:center; flex-direction:column;
    }
  </style>
</head>
<body>

<div id="slide-a" class="slide"></div>
<div id="slide-b" class="slide"></div>
<div id="progress-bar"></div>
<div id="offline-badge">⚠ Hors ligne — cache local actif</div>
<div id="empty-state">
  <div class="empty-logo">Te<span>Ma</span></div>
  <div class="empty-msg">En attente de contenu</div>
  <div class="empty-sub">Connectez-vous à l'Admin Panel pour ajouter des médias</div>
</div>
<div id="debug"></div>
<div id="emergency-overlay"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyADOBJVhaBEMbGCLqw-J_9W-tIIN4_vYes",
  authDomain:        "tema-boutique.firebaseapp.com",
  projectId:         "tema-boutique",
  storageBucket:     "tema-boutique.firebasestorage.app",
  messagingSenderId: "384084902486",
  appId:             "1:384084902486:web:13ae76b5102abe4b2931f7"
};

const PARAMS    = new URLSearchParams(window.location.search);
const SCREEN_ID = PARAMS.get('screen') || '1';
const CACHE_KEY = `tema_playlist_s${SCREEN_ID}`;

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });
db.enablePersistence().catch(() => {});

// ── DOM
const slideA   = document.getElementById('slide-a');
const slideB   = document.getElementById('slide-b');
const progress = document.getElementById('progress-bar');
const offline  = document.getElementById('offline-badge');
const emptyEl  = document.getElementById('empty-state');
const debugEl  = document.getElementById('debug');

// ── État
let playlist       = [];
let cachedPlaylist = [];
let current        = 0;
let activeSlide    = 'A';
let imgTimer       = null;
let emergencyMode  = false;

// ═══ HEARTBEAT — statut live des écrans ═══
function sendHeartbeat() {
  const currentItem = playlist[current];
  db.collection('screens').doc(SCREEN_ID).set({
    online:           true,
    playing:          playlist.length > 0,
    lastSeen:         firebase.firestore.FieldValue.serverTimestamp(),
    currentMedia:     currentItem?.name  || null,
    currentMediaUrl:  currentItem?.url   || null,
    currentMediaType: currentItem?.type  || null,
    screenId:         SCREEN_ID
  }, { merge: true });
}
sendHeartbeat();
setInterval(sendHeartbeat, 30000);

window.addEventListener('beforeunload', () => {
  try { db.collection('screens').doc(SCREEN_ID).update({ online: false }); } catch(e) {}
});

// ═══ CACHE LOCAL ═══
function saveCache(items) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(items)); } catch(e) {}
}
function loadCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); } catch(e) { return []; }
}

// ═══ FILTRE PROGRAMMATION HORAIRE ═══
function isScheduleActive(item) {
  const s = item.schedule;
  if (!s || !s.enabled) return true;
  const now     = new Date();
  const day     = now.getDay();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  if (s.startDate && now < s.startDate.toDate()) return false;
  if (s.endDate   && now > s.endDate.toDate())   return false;
  if (s.daysOfWeek?.length > 0 && !s.daysOfWeek.includes(day)) return false;
  if (s.startTime && timeStr < s.startTime) return false;
  if (s.endTime   && timeStr > s.endTime)   return false;
  return true;
}

// ═══ SLIDES ═══
function renderItem(slide, item) {
  slide.innerHTML = '';
  if (!item) return;
  if (item.type === 'video') {
    const v = document.createElement('video');
    v.src = item.url; v.autoplay = true; v.muted = true;
    v.playsInline = true; v.loop = true; v.onerror = nextItem;
    slide.appendChild(v);
  } else {
    const img = document.createElement('img');
    img.src = item.url; img.alt = item.name || ''; img.onerror = nextItem;
    slide.appendChild(img);
  }
}

function startProgress(durationMs) {
  progress.style.transition = 'none';
  progress.style.width      = '0%';
  requestAnimationFrame(() => {
    progress.style.transition = `width ${durationMs}ms linear`;
    progress.style.width      = '100%';
  });
}

function showItem(index) {
  if (playlist.length === 0) { emptyEl.classList.add('visible'); return; }
  emptyEl.classList.remove('visible');

  const item  = playlist[index];
  const curEl = activeSlide === 'A' ? slideA : slideB;
  const nxtEl = activeSlide === 'A' ? slideB : slideA;
  renderItem(nxtEl, item);
  requestAnimationFrame(() => {
    nxtEl.classList.add('active');
    curEl.classList.remove('active');
    activeSlide = activeSlide === 'A' ? 'B' : 'A';
  });
  debugEl.textContent = `Écran ${SCREEN_ID} · ${index+1}/${playlist.length} · ${item.name || ''}`;
  clearTimeout(imgTimer);
  if (item.duration && item.duration > 0) {
    const dur = item.duration * 1000;
    startProgress(dur);
    imgTimer = setTimeout(nextItem, dur);
  } else {
    progress.style.width = '0%';
  }
}

function nextItem() {
  clearTimeout(imgTimer);
  current = (current + 1) % playlist.length;
  showItem(current);
}

// ═══ PLAYLIST — chargement + filtre ═══
function applyPlaylist(items) {
  cachedPlaylist = items;
  const filtered = items.filter(isScheduleActive);
  playlist = filtered;
  if (filtered.length > 0) {
    current = 0;
    showItem(0);
  } else {
    playlist = [];
    emptyEl.classList.add('visible');
  }
}

function fetchPlaylist() {
  db.collection('playlist')
    .orderBy('order', 'asc')
    .onSnapshot(snapshot => {
      const items = [];
      snapshot.forEach(doc => {
        const d       = doc.data();
        if (!d.active) return;
        const screens = d.screens || ['1','2','3'];
        if (screens.includes(SCREEN_ID) || screens.includes('all')) {
          items.push({ id: doc.id, ...d });
        }
      });
      offline.style.display = 'none';
      if (items.length > 0) saveCache(items);
      applyPlaylist(items);
    }, err => {
      console.warn('Offline:', err.message);
      offline.style.display = 'block';
      const cached = loadCache();
      if (cached.length > 0 && playlist.length === 0) applyPlaylist(cached);
    });
}

// Re-filtrer toutes les minutes (changement de plage horaire)
setInterval(() => {
  if (emergencyMode || cachedPlaylist.length === 0) return;
  const filtered = cachedPlaylist.filter(isScheduleActive);
  const curIds   = playlist.map(i => i.id).join(',');
  const newIds   = filtered.map(i => i.id).join(',');
  if (curIds !== newIds) {
    playlist = filtered;
    current  = 0;
    if (playlist.length > 0) showItem(0);
    else emptyEl.classList.add('visible');
  }
}, 60000);

// ═══ DIFFUSION D'URGENCE ═══
function showEmergency(data) {
  emergencyMode = true;
  clearTimeout(imgTimer);
  const overlay = document.getElementById('emergency-overlay');
  overlay.style.display    = 'flex';
  overlay.style.background = data.backgroundColor || '#DC2626';
  if (data.imageUrl) {
    overlay.innerHTML = `<img src="${data.imageUrl}" style="max-width:90%;max-height:90%;object-fit:contain">`;
  } else {
    overlay.innerHTML = `<div style="color:${data.textColor||'#fff'};font-size:clamp(24px,5vw,72px);font-weight:700;text-align:center;padding:40px;line-height:1.3">${data.message}</div>`;
  }
}

function hideEmergency() {
  emergencyMode = false;
  document.getElementById('emergency-overlay').style.display = 'none';
  if (playlist.length > 0) showItem(current);
}

db.collection('config').doc('emergency').onSnapshot(doc => {
  const data = doc.data();
  if (data?.active) {
    if (data.expiresAt && new Date() > data.expiresAt.toDate()) return;
    showEmergency(data);
  } else {
    if (emergencyMode) hideEmergency();
  }
}, () => {});

// Empêcher la mise en veille
setInterval(() => {
  document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true }));
}, 55000);

fetchPlaylist();
</script>
</body>
</html>
