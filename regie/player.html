<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeMa Display Player</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#000; overflow:hidden;
      width:100vw; height:100vh;
      font-family:sans-serif; cursor:none;
    }
    .slide {
      position:absolute; inset:0; opacity:0;
      transition:opacity 0.9s ease-in-out;
      display:flex; align-items:center; justify-content:center;
      background:#000;
    }
    .slide.active { opacity:1; }
    .slide img, .slide video { width:100vw; height:100vh; object-fit:cover; }

    #progress-bar {
      position:fixed; bottom:0; left:0; height:3px; width:0%;
      background:#C8981A; z-index:200; transition:width linear;
    }
    #offline-badge {
      position:fixed; top:16px; right:16px;
      background:rgba(200,50,0,0.85); color:#fff;
      font-size:12px; font-weight:600; padding:6px 14px;
      border-radius:6px; z-index:300; display:none; letter-spacing:0.04em;
    }
    /* ── ÉCRAN D'ATTENTE ── */
    #empty-state {
      display:none; position:fixed; inset:0;
      flex-direction:column; align-items:center; justify-content:center;
      background: radial-gradient(ellipse 140% 120% at 50% 65%, #221508 0%, #0D0803 50%, #020100 100%);
      overflow:hidden; font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
    }
    #empty-state.visible { display:flex; }
    #es-canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .es-glow {
      position:absolute; width:500px; height:500px; border-radius:50%;
      background:radial-gradient(circle, rgba(200,152,26,0.07) 0%, transparent 70%);
      animation:esGlowPulse 7s ease-in-out infinite; pointer-events:none; z-index:1;
    }
    @keyframes esGlowPulse {
      0%,100%{ transform:scale(1); opacity:.7; }
      50%{ transform:scale(1.35); opacity:1; }
    }
    .es-center {
      position:relative; z-index:10;
      display:flex; flex-direction:column; align-items:center;
    }
    .es-logo-img {
      width:clamp(260px, 35vw, 500px); height:auto;
      mix-blend-mode:screen;
      animation:esLogoPulse 5s ease-in-out infinite;
      filter:brightness(1.08) saturate(1.15);
      margin-bottom:-10px;
    }
    @keyframes esLogoPulse {
      0%,100%{ transform:scale(1); filter:brightness(1.05) saturate(1.1); }
      50%{ transform:scale(1.025); filter:brightness(1.18) saturate(1.2); }
    }
    .es-divider {
      width:72px; height:1px; margin:22px auto;
      background:linear-gradient(90deg, transparent, rgba(200,152,26,0.38), transparent);
    }
    .es-msg {
      font-size:11px; font-weight:600; letter-spacing:5px; text-transform:uppercase;
      color:rgba(237,217,178,0.45);
      animation:esMsgShimmer 4s ease-in-out infinite;
    }
    @keyframes esMsgShimmer {
      0%,100%{ opacity:.45; } 50%{ opacity:.7; }
    }
    .es-clock {
      position:absolute; bottom:44px; left:50%; transform:translateX(-50%);
      font-size:40px; font-weight:200; letter-spacing:8px;
      color:rgba(200,152,26,0.40); z-index:10;
      font-variant-numeric:tabular-nums;
      text-shadow:0 0 20px rgba(200,152,26,0.18);
    }
    .es-screen-id {
      position:absolute; bottom:22px; right:24px;
      font-size:9px; letter-spacing:3px; text-transform:uppercase;
      color:rgba(237,217,178,0.13); z-index:10;
    }
    #debug {
      position:fixed; bottom:10px; left:12px;
      font-size:10px; color:rgba(255,255,255,0.15);
      font-family:monospace; z-index:200; pointer-events:none;
    }
    #emergency-overlay {
      display:none; position:fixed; inset:0; z-index:9999;
      align-items:center; justify-content:center; flex-direction:column;
    }
  </style>
</head>
<body>

<div id="slide-a" class="slide"></div>
<div id="slide-b" class="slide"></div>
<div id="progress-bar"></div>
<div id="offline-badge">⚠ Hors ligne — cache local actif</div>
<div id="empty-state">
  <canvas id="es-canvas"></canvas>
  <div class="es-glow"></div>
  <div class="es-center">
    <img class="es-logo-img" src="logo_tema_circle_raw.png" alt="TeMa Boutique">
    <div class="es-divider"></div>
    <div class="es-msg">En attente de contenu</div>
  </div>
  <div class="es-clock" id="es-clock">--:--</div>
  <div class="es-screen-id" id="es-screen-id"></div>
</div>
<div id="debug"></div>
<div id="emergency-overlay"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyADOBJVhaBEMbGCLqw-J_9W-tIIN4_vYes",
  authDomain:        "tema-boutique.firebaseapp.com",
  projectId:         "tema-boutique",
  storageBucket:     "tema-boutique.firebasestorage.app",
  messagingSenderId: "384084902486",
  appId:             "1:384084902486:web:13ae76b5102abe4b2931f7"
};

const PARAMS    = new URLSearchParams(window.location.search);
const SCREEN_ID = PARAMS.get('screen') || '1';
const CACHE_KEY = `tema_playlist_s${SCREEN_ID}`;

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });
db.enablePersistence().catch(() => {});

// ── DOM
const slideA   = document.getElementById('slide-a');
const slideB   = document.getElementById('slide-b');
const progress = document.getElementById('progress-bar');
const offline  = document.getElementById('offline-badge');
const emptyEl  = document.getElementById('empty-state');
const debugEl  = document.getElementById('debug');

// ── État
let playlist       = [];
let cachedPlaylist = [];
let current        = 0;
let activeSlide    = 'A';
let imgTimer       = null;
let emergencyMode  = false;
let isPaused       = false;

// ═══ HEARTBEAT — statut live des écrans ═══
function sendHeartbeat() {
  const currentItem = playlist[current];
  db.collection('screens').doc(SCREEN_ID).set({
    online:           true,
    playing:          playlist.length > 0,
    lastSeen:         firebase.firestore.FieldValue.serverTimestamp(),
    currentMedia:     currentItem?.name  || null,
    currentMediaUrl:  currentItem?.url   || null,
    currentMediaType: currentItem?.type  || null,
    screenId:         SCREEN_ID
  }, { merge: true });
}
db.collection('screens').doc(SCREEN_ID).set({ paused: false }, { merge: true });
sendHeartbeat();
setInterval(sendHeartbeat, 30000);

window.addEventListener('beforeunload', () => {
  try { db.collection('screens').doc(SCREEN_ID).update({ online: false }); } catch(e) {}
});

// ═══ CACHE LOCAL ═══
function saveCache(items) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(items)); } catch(e) {}
}
function loadCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); } catch(e) { return []; }
}

// ═══ FILTRE PROGRAMMATION HORAIRE ═══
function isScheduleActive(item) {
  const s = item.schedule;
  if (!s || !s.enabled) return true;
  const now     = new Date();
  const day     = now.getDay();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  if (s.startDate && now < s.startDate.toDate()) return false;
  if (s.endDate   && now > s.endDate.toDate())   return false;
  if (s.daysOfWeek?.length > 0 && !s.daysOfWeek.includes(day)) return false;
  if (s.startTime && timeStr < s.startTime) return false;
  if (s.endTime   && timeStr > s.endTime)   return false;
  return true;
}

// ═══ SLIDES ═══
function renderItem(slide, item) {
  slide.innerHTML = '';
  if (!item) return;
  if (item.type === 'video') {
    const v = document.createElement('video');
    v.src = item.url; v.autoplay = true; v.muted = true;
    v.playsInline = true; v.loop = true; v.onerror = nextItem;
    slide.appendChild(v);
  } else {
    const img = document.createElement('img');
    img.src = item.url; img.alt = item.name || ''; img.onerror = nextItem;
    slide.appendChild(img);
  }
}

function startProgress(durationMs) {
  progress.style.transition = 'none';
  progress.style.width      = '0%';
  requestAnimationFrame(() => {
    progress.style.transition = `width ${durationMs}ms linear`;
    progress.style.width      = '100%';
  });
}

function showItem(index) {
  if (isPaused) return;
  if (playlist.length === 0) { emptyEl.classList.add('visible'); return; }
  emptyEl.classList.remove('visible');

  const item  = playlist[index];
  const curEl = activeSlide === 'A' ? slideA : slideB;
  const nxtEl = activeSlide === 'A' ? slideB : slideA;
  renderItem(nxtEl, item);
  requestAnimationFrame(() => {
    nxtEl.classList.add('active');
    curEl.classList.remove('active');
    activeSlide = activeSlide === 'A' ? 'B' : 'A';
  });
  debugEl.textContent = `Écran ${SCREEN_ID} · ${index+1}/${playlist.length} · ${item.name || ''}`;
  clearTimeout(imgTimer);
  if (item.duration && item.duration > 0) {
    const dur = item.duration * 1000;
    startProgress(dur);
    imgTimer = setTimeout(nextItem, dur);
  } else {
    progress.style.width = '0%';
  }
}

function nextItem() {
  clearTimeout(imgTimer);
  current = (current + 1) % playlist.length;
  showItem(current);
}

// ═══ PLAYLIST — chargement + filtre ═══
function applyPlaylist(items) {
  cachedPlaylist = items;
  const filtered = items.filter(isScheduleActive);
  playlist = filtered;
  if (filtered.length > 0) {
    current = 0;
    showItem(0);
  } else {
    playlist = [];
    clearTimeout(imgTimer);
    [slideA, slideB].forEach(s => {
      const v = s.querySelector('video');
      if (v) { v.pause(); v.src = ''; }
      s.innerHTML = '';
      s.classList.remove('active');
    });
    activeSlide = 'A';
    emptyEl.classList.add('visible');
  }
}

function fetchPlaylist() {
  db.collection('playlist')
    .orderBy('order', 'asc')
    .onSnapshot(snapshot => {
      const items = [];
      snapshot.forEach(doc => {
        const d       = doc.data();
        if (!d.active) return;
        const screens = d.screens || ['1','2','3'];
        if (screens.includes(SCREEN_ID) || screens.includes('all')) {
          items.push({ id: doc.id, ...d });
        }
      });
      offline.style.display = 'none';
      if (items.length > 0) saveCache(items);
      applyPlaylist(items);
    }, err => {
      console.warn('Offline:', err.message);
      offline.style.display = 'block';
      const cached = loadCache();
      if (cached.length > 0 && playlist.length === 0) applyPlaylist(cached);
    });
}

// Re-filtrer toutes les minutes (changement de plage horaire)
setInterval(() => {
  if (emergencyMode || cachedPlaylist.length === 0) return;
  const filtered = cachedPlaylist.filter(isScheduleActive);
  const curIds   = playlist.map(i => i.id).join(',');
  const newIds   = filtered.map(i => i.id).join(',');
  if (curIds !== newIds) {
    playlist = filtered;
    current  = 0;
    if (playlist.length > 0) showItem(0);
    else emptyEl.classList.add('visible');
  }
}, 60000);

// ═══ DIFFUSION D'URGENCE ═══
function showEmergency(data) {
  emergencyMode = true;
  clearTimeout(imgTimer);
  const overlay = document.getElementById('emergency-overlay');
  overlay.style.display    = 'flex';
  overlay.style.background = data.backgroundColor || '#DC2626';
  if (data.imageUrl) {
    overlay.innerHTML = `<img src="${data.imageUrl}" style="max-width:90%;max-height:90%;object-fit:contain">`;
  } else {
    overlay.innerHTML = `<div style="color:${data.textColor||'#fff'};font-size:clamp(24px,5vw,72px);font-weight:700;text-align:center;padding:40px;line-height:1.3">${data.message}</div>`;
  }
}

function hideEmergency() {
  emergencyMode = false;
  document.getElementById('emergency-overlay').style.display = 'none';
  if (playlist.length > 0) showItem(current);
}

db.collection('config').doc('emergency').onSnapshot(doc => {
  const data = doc.data();
  if (data?.active) {
    if (data.expiresAt && new Date() > data.expiresAt.toDate()) return;
    showEmergency(data);
  } else {
    if (emergencyMode) hideEmergency();
  }
}, () => {});

// ═══ CONTRÔLE PAUSE DEPUIS LA RÉGIE ═══
db.collection('screens').doc(SCREEN_ID).onSnapshot(doc => {
  const data = doc.data();
  if (!data) return;
  const shouldPause = data.paused === true;

  if (shouldPause && !isPaused) {
    isPaused = true;
    clearTimeout(imgTimer);
    progress.style.transition = 'none';
    progress.style.width = '0%';
    const activeEl = activeSlide === 'A' ? slideA : slideB;
    const video = activeEl.querySelector('video');
    if (video) video.pause();
  } else if (!shouldPause && isPaused) {
    isPaused = false;
    if (!emergencyMode && playlist.length > 0) showItem(current);
  }
}, () => {});

// Empêcher la mise en veille
setInterval(() => {
  document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true }));
}, 55000);

fetchPlaylist();

// ── ANIMATION ÉCRAN D'ATTENTE ──
(function() {
  const canvas = document.getElementById('es-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = [
    'rgba(200,152,26,',   // or x2
    'rgba(200,152,26,',
    'rgba(78,205,196,',   // teal
    'rgba(237,217,178,',  // cream
  ];

  function mkP() {
    const sz = Math.random() * 3.5 + 1.2;
    return {
      x: Math.random() * W,
      y: H + sz * 6,
      size: sz,
      blur: sz * (Math.random() * 3 + 2.5),
      op: Math.random() * 0.22 + 0.04,
      vx: (Math.random() - 0.5) * 0.22,
      vy: -(Math.random() * 0.38 + 0.08),
      phase: Math.random() * Math.PI * 2,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
    };
  }

  const pts = Array.from({ length: 58 }, () => {
    const p = mkP();
    p.y = Math.random() * H;
    return p;
  });

  let rafId;
  function tick() {
    ctx.clearRect(0, 0, W, H);
    const t = Date.now() * 0.0003;
    for (const p of pts) {
      const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.blur);
      grd.addColorStop(0, p.color + p.op + ')');
      grd.addColorStop(1, p.color + '0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.blur, 0, Math.PI * 2);
      ctx.fill();
      p.x += p.vx + Math.sin(t + p.phase) * 0.18;
      p.y += p.vy;
      if (p.y + p.blur < 0) Object.assign(p, mkP());
    }
    rafId = requestAnimationFrame(tick);
  }

  // Start / stop with #empty-state visibility
  const observer = new MutationObserver(() => {
    const visible = document.getElementById('empty-state').classList.contains('visible');
    if (visible && !rafId) { rafId = requestAnimationFrame(tick); }
    else if (!visible && rafId) { cancelAnimationFrame(rafId); rafId = null; }
  });
  observer.observe(document.getElementById('empty-state'), { attributes: true });

  // Clock
  const clockEl    = document.getElementById('es-clock');
  const screenIdEl = document.getElementById('es-screen-id');
  if (screenIdEl && typeof SCREEN_ID !== 'undefined') {
    screenIdEl.textContent = 'ÉCRAN ' + SCREEN_ID;
  }
  function tick_clock() {
    if (!clockEl) return;
    const d = new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    clockEl.textContent = h + ':' + m;
  }
  tick_clock();
  setInterval(tick_clock, 5000);
})();
</script>
</body>
</html>
