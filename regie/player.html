<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeMa Display Player</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#000; overflow:hidden;
      width:100vw; height:100vh;
      font-family:sans-serif; cursor:none;
    }
    .slide {
      position:absolute; inset:0; opacity:0;
      transition:opacity 0.9s ease-in-out;
      display:flex; align-items:center; justify-content:center;
      background:#000;
    }
    .slide.active { opacity:1; }
    .slide img, .slide video { width:100vw; height:100vh; object-fit:cover; }

    #progress-bar {
      position:fixed; bottom:0; left:0; height:3px; width:0%;
      background:#C8981A; z-index:200; transition:width linear;
    }
    #offline-badge {
      position:fixed; top:16px; right:16px;
      background:rgba(200,50,0,0.85); color:#fff;
      font-size:12px; font-weight:600; padding:6px 14px;
      border-radius:6px; z-index:300; display:none; letter-spacing:0.04em;
    }
    /* ── ÉCRAN D'ATTENTE "LUMIÈRE DORÉE" ── */
    #empty-state {
      display:none; position:fixed; inset:0;
      flex-direction:column; align-items:center; justify-content:center;
      background: radial-gradient(ellipse 80% 65% at 50% 44%, #2D1800 0%, #150C02 38%, #070402 68%, #010000 100%);
      overflow:hidden; font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
    }
    #empty-state.visible { display:flex; }
    #es-canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .es-halo {
      position:absolute; width:560px; height:560px; border-radius:50%;
      background:radial-gradient(circle, rgba(230,165,20,0.18) 0%, rgba(180,100,0,0.07) 42%, transparent 72%);
      animation:esHaloPulse 3.5s ease-in-out infinite; pointer-events:none; z-index:1;
    }
    @keyframes esHaloPulse {
      0%,100%{ transform:scale(0.88); opacity:0.62; }
      50%{ transform:scale(1.20); opacity:1; }
    }
    .es-center {
      position:relative; z-index:10;
      display:flex; flex-direction:column; align-items:center;
    }
    .es-logo-img {
      width:clamp(320px, 42vw, 600px); height:auto;
      animation:esLogoPulse 4s ease-in-out infinite;
      filter:drop-shadow(0 0 24px rgba(255,190,40,0.72))
             drop-shadow(0 0 60px rgba(215,148,0,0.44))
             drop-shadow(0 0 110px rgba(180,90,0,0.22))
             brightness(1.14) saturate(1.28);
      margin-bottom:-8px;
    }
    @keyframes esLogoPulse {
      0%,100%{
        transform:scale(1);
        filter:drop-shadow(0 0 24px rgba(255,190,40,0.72)) drop-shadow(0 0 60px rgba(215,148,0,0.44)) brightness(1.14) saturate(1.28);
      }
      50%{
        transform:scale(1.034);
        filter:drop-shadow(0 0 38px rgba(255,218,65,0.92)) drop-shadow(0 0 92px rgba(235,168,0,0.60)) drop-shadow(0 0 145px rgba(195,105,0,0.32)) brightness(1.28) saturate(1.42);
      }
    }
    .es-divider {
      width:120px; height:1px; margin:24px auto;
      background:linear-gradient(90deg, transparent, rgba(238,182,52,0.68), transparent);
    }
    .es-msg {
      font-size:20px; font-weight:700; letter-spacing:7px; text-transform:uppercase;
      color:rgba(248,222,158,0.75);
      animation:esMsgShimmer 3.5s ease-in-out infinite;
    }
    @keyframes esMsgShimmer {
      0%,100%{ opacity:.75; letter-spacing:7px; }
      50%{ opacity:1; letter-spacing:8px; }
    }
    .es-clock {
      position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
      font-size:64px; font-weight:200; letter-spacing:10px;
      color:rgba(228,176,44,0.62); z-index:10;
      font-variant-numeric:tabular-nums;
      text-shadow:0 0 40px rgba(228,176,44,0.42), 0 0 80px rgba(205,135,0,0.20);
    }
    .es-screen-id {
      position:absolute; bottom:22px; right:24px;
      font-size:9px; letter-spacing:3px; text-transform:uppercase;
      color:rgba(237,217,178,0.18); z-index:10;
    }
    .es-service-wrap {
      margin-top:28px; height:56px;
      display:flex; align-items:center; justify-content:center;
      position:relative; overflow:hidden; min-width:420px;
    }
    .es-service {
      position:absolute;
      display:flex; align-items:center; gap:10px;
      font-size:22px; font-weight:700; letter-spacing:5px; text-transform:uppercase;
      color:rgba(255,215,105,0.88); white-space:nowrap;
      opacity:0; transition:opacity 0.9s ease;
    }
    .es-service.active { opacity:1; }
    .es-service-icon { font-size:17px; line-height:1; }
    #debug {
      position:fixed; bottom:10px; left:12px;
      font-size:10px; color:rgba(255,255,255,0.15);
      font-family:monospace; z-index:200; pointer-events:none;
    }
    #emergency-overlay {
      display:none; position:fixed; inset:0; z-index:9999;
      align-items:center; justify-content:center; flex-direction:column;
    }
  </style>
</head>

const CACHE_KEY = `tema_playlist_s${SCREEN_ID}`;

firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });
db.enablePersistence().catch(() => {});

// ── DOM
const slideA   = document.getElementById('slide-a');
const slideB   = document.getElementById('slide-b');
const progress = document.getElementById('progress-bar');
const offline  = document.getElementById('offline-badge');
const emptyEl  = document.getElementById('empty-state');
const debugEl  = document.getElementById('debug');

// ── État
let playlist       = [];
let cachedPlaylist = [];
let current        = 0;
let activeSlide    = 'A';
let imgTimer       = null;
let emergencyMode  = false;
let isPaused       = false;

// ═══ HEARTBEAT — statut live des écrans ═══
function sendHeartbeat() {
  const currentItem = playlist[current];
  db.collection('screens').doc(SCREEN_ID).set({
    online:           true,
    playing:          playlist.length > 0,
    lastSeen:         firebase.firestore.FieldValue.serverTimestamp(),
    currentMedia:     currentItem?.name  || null,
    currentMediaUrl:  currentItem?.url   || null,
    currentMediaType: currentItem?.type  || null,
    screenId:         SCREEN_ID
  }, { merge: true });
}
db.collection('screens').doc(SCREEN_ID).set({ paused: false }, { merge: true });
sendHeartbeat();
setInterval(sendHeartbeat, 30000);

window.addEventListener('beforeunload', () => {
  try { db.collection('screens').doc(SCREEN_ID).update({ online: false }); } catch(e) {}
});

// ═══ CACHE LOCAL ═══
function saveCache(items) {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(items)); } catch(e) {}
}
function loadCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || '[]'); } catch(e) { return []; }
}

// ═══ FILTRE PROGRAMMATION HORAIRE ═══
function isScheduleActive(item) {
  const s = item.schedule;
  if (!s || !s.enabled) return true;
  const now     = new Date();
  const day     = now.getDay();
  const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  if (s.startDate && now < s.startDate.toDate()) return false;
  if (s.endDate   && now > s.endDate.toDate())   return false;
  if (s.daysOfWeek?.length > 0 && !s.daysOfWeek.includes(day)) return false;
  if (s.startTime && timeStr < s.startTime) return false;
  if (s.endTime   && timeStr > s.endTime)   return false;
  return true;
}

// ═══ SLIDES ═══
function renderItem(slide, item) {
  slide.innerHTML = '';
  if (!item) return;
  if (item.type === 'video') {
    const v = document.createElement('video');
    v.src = item.url; v.autoplay = true; v.muted = true;
    v.playsInline = true; v.loop = true; v.onerror = nextItem;
    slide.appendChild(v);
  } else if (item.type === 'html') {
    const f = document.createElement('iframe');
    f.src = item.url;
    f.style.cssText = 'width:100%;height:100%;border:none;';
    f.allow = 'autoplay;fullscreen';
    slide.appendChild(f);
  } else {
    const img = document.createElement('img');
    img.src = item.url; img.alt = item.name || ''; img.onerror = nextItem;
    slide.appendChild(img);
  }
}

function startProgress(durationMs) {
  progress.style.transition = 'none';
  progress.style.width      = '0%';
  requestAnimationFrame(() => {
    progress.style.transition = `width ${durationMs}ms linear`;
    progress.style.width      = '100%';
  });
}

function showItem(index) {
  if (isPaused) return;
  if (playlist.length === 0) { emptyEl.classList.add('visible'); return; }
  emptyEl.classList.remove('visible');

  const item  = playlist[index];
  const curEl = activeSlide === 'A' ? slideA : slideB;
  const nxtEl = activeSlide === 'A' ? slideB : slideA;
  renderItem(nxtEl, item);
  requestAnimationFrame(() => {
    nxtEl.classList.add('active');
    curEl.classList.remove('active');
    activeSlide = activeSlide === 'A' ? 'B' : 'A';
  });
  debugEl.textContent = `Écran ${SCREEN_ID} · ${index+1}/${playlist.length} · ${item.name || ''}`;
  clearTimeout(imgTimer);
  if (item.duration && item.duration > 0) {
    const dur = item.duration * 1000;
    startProgress(dur);
    imgTimer = setTimeout(nextItem, dur);
  } else {
    progress.style.width = '0%';
  }
}

function nextItem() {
  clearTimeout(imgTimer);
  current = (current + 1) % playlist.length;
  showItem(current);
}

// ═══ PLAYLIST — chargement + filtre ═══
function applyPlaylist(items) {
  cachedPlaylist = items;
  const filtered = items.filter(isScheduleActive);
  playlist = filtered;
  if (filtered.length > 0) {
    current = 0;
    showItem(0);
  } else {
    playlist = [];
    clearTimeout(imgTimer);
    [slideA, slideB].forEach(s => {
      const v = s.querySelector('video');
      if (v) { v.pause(); v.src = ''; }
      s.innerHTML = '';
      s.classList.remove('active');
    });
    activeSlide = 'A';
    emptyEl.classList.add('visible');
  }
}

function fetchPlaylist() {
  db.collection('playlist')
    .orderBy('order', 'asc')
    .onSnapshot(snapshot => {
      const items = [];
      snapshot.forEach(doc => {
        const d       = doc.data();
        if (!d.active) return;
        const screens = d.screens || ['1','2','3'];
        if (screens.includes(SCREEN_ID) || screens.includes('all')) {
          items.push({ id: doc.id, ...d });
        }
      });
      offline.style.display = 'none';
      if (items.length > 0) saveCache(items);
      applyPlaylist(items);
    }, err => {
      console.warn('Offline:', err.message);
      offline.style.display = 'block';
      const cached = loadCache();
      if (cached.length > 0 && playlist.length === 0) applyPlaylist(cached);
    });
}

// Re-filtrer toutes les minutes (changement de plage horaire)
setInterval(() => {
  if (emergencyMode || cachedPlaylist.length === 0) return;
  const filtered = cachedPlaylist.filter(isScheduleActive);
  const curIds   = playlist.map(i => i.id).join(',');
  const newIds   = filtered.map(i => i.id).join(',');
  if (curIds !== newIds) {
    playlist = filtered;
    current  = 0;
    if (playlist.length > 0) showItem(0);
    else emptyEl.classList.add('visible');
  }
}, 60000);

// ═══ DIFFUSION D'URGENCE ═══
function showEmergency(data) {
  emergencyMode = true;
  clearTimeout(imgTimer);
  const overlay = document.getElementById('emergency-overlay');
  overlay.style.display    = 'flex';
  overlay.style.background = data.backgroundColor || '#DC2626';
  if (data.imageUrl) {
    overlay.innerHTML = `<img src="${data.imageUrl}" style="max-width:90%;max-height:90%;object-fit:contain">`;
  } else {
    overlay.innerHTML = `<div style="color:${data.textColor||'#fff'};font-size:clamp(24px,5vw,72px);font-weight:700;text-align:center;padding:40px;line-height:1.3">${data.message}</div>`;
  }
}

function hideEmergency() {
  emergencyMode = false;
  document.getElementById('emergency-overlay').style.display = 'none';
  if (playlist.length > 0) showItem(current);
}

db.collection('config').doc('emergency').onSnapshot(doc => {
  const data = doc.data();
  if (data?.active) {
    if (data.expiresAt && new Date() > data.expiresAt.toDate()) return;
    showEmergency(data);
  } else {
    if (emergencyMode) hideEmergency();
  }
}, () => {});

// ═══ CONTRÔLE PAUSE DEPUIS LA RÉGIE ═══
db.collection('screens').doc(SCREEN_ID).onSnapshot(doc => {
  const data = doc.data();
  if (!data) return;
  const shouldPause = data.paused === true;

  if (shouldPause && !isPaused) {
    isPaused = true;
    clearTimeout(imgTimer);
    progress.style.transition = 'none';
    progress.style.width = '0%';
    const activeEl = activeSlide === 'A' ? slideA : slideB;
    const video = activeEl.querySelector('video');
    if (video) video.pause();
  } else if (!shouldPause && isPaused) {
    isPaused = false;
    if (!emergencyMode && playlist.length > 0) showItem(current);
  }
}, () => {});

// Empêcher la mise en veille
setInterval(() => {
  document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true }));
}, 55000);

fetchPlaylist();
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {

// ── CANVAS ANIMATION
var canvas = document.getElementById('es-canvas');
if (!canvas) return;
var ctx = canvas.getContext('2d');
var W = 0, H = 0;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; initSparks(); }
resize();
window.addEventListener('resize', resize);

function drawRays(cx, cy, t) {
  var N = 14;
  ctx.save(); ctx.translate(cx, cy);
  var rot = t * 0.18;
  for (var i = 0; i < N; i++) {
    var a = rot + (i / N) * Math.PI * 2;
    var len = Math.min(W, H) * 0.72;
    var sp = 0.055;
    var grd = ctx.createLinearGradient(0, 0, Math.cos(a)*len*0.85, Math.sin(a)*len*0.85);
    grd.addColorStop(0,    'rgba(255,185,40,0.10)');
    grd.addColorStop(0.55, 'rgba(200,120,0,0.025)');
    grd.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a-sp)*len, Math.sin(a-sp)*len);
    ctx.lineTo(Math.cos(a+sp)*len, Math.sin(a+sp)*len);
    ctx.closePath();
    ctx.fillStyle = grd; ctx.fill();
  }
  ctx.restore();
}

var GC = ['rgba(225,160,22,','rgba(225,160,22,','rgba(255,210,80,','rgba(78,205,196,'];
function mkP() {
  var sz = Math.random()*4.5+1.5;
  return { x:Math.random()*W, y:H+sz*6, blur:sz*(Math.random()*3.5+2.5),
           op:Math.random()*0.28+0.06, vx:(Math.random()-.5)*.28, vy:-(Math.random()*.48+.1),
           phase:Math.random()*Math.PI*2, color:GC[Math.floor(Math.random()*GC.length)] };
}
var pts = [];
for (var i = 0; i < 68; i++) { var p = mkP(); p.y = Math.random()*H; pts.push(p); }

var sparks = [];
function mkSpark() {
  var cx = W*.5, cy = H*.42;
  var a = Math.random()*Math.PI*2;
  var r = Math.pow(Math.random(),.6)*Math.min(W,H)*.32;
  return { x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r,
           life:0, maxLife:55+Math.random()*85, sz:Math.random()*2+.4 };
}
function initSparks() { sparks=[]; for(var i=0;i<35;i++){var s=mkSpark();s.life=Math.random()*s.maxLife;sparks.push(s);} }
initSparks();

var rafId = null;
function tick() {
  ctx.clearRect(0,0,W,H);
  var t = Date.now()*.001;
  var cx = W*.5, cy = H*.42;
  drawRays(cx,cy,t);
  for (var i=0;i<pts.length;i++) {
    var p=pts[i];
    var grd=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.blur);
    grd.addColorStop(0,p.color+p.op+')'); grd.addColorStop(1,p.color+'0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(p.x,p.y,p.blur,0,Math.PI*2); ctx.fill();
    p.x+=p.vx+Math.sin(t*.3+p.phase)*.22; p.y+=p.vy;
    if(p.y+p.blur<0) pts[i]=mkP();
  }
  for (var j=0;j<sparks.length;j++) {
    var s=sparks[j]; s.life++;
    if(s.life>s.maxLife){sparks[j]=mkSpark();continue;}
    var prog=s.life/s.maxLife;
    var al=prog<.25?prog/.25:prog>.72?(1-prog)/.28:1;
    var sz=s.sz*(1-Math.abs(prog-.5)*.35);
    ctx.fillStyle='rgba(255,215,80,'+(al*.82)+')';
    ctx.beginPath(); ctx.arc(s.x,s.y,sz,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,235,130,'+(al*.45)+')'; ctx.lineWidth=.55;
    ctx.beginPath();
    ctx.moveTo(s.x-sz*2.8,s.y); ctx.lineTo(s.x+sz*2.8,s.y);
    ctx.moveTo(s.x,s.y-sz*2.8); ctx.lineTo(s.x,s.y+sz*2.8);
    ctx.stroke();
  }
  rafId = requestAnimationFrame(tick);
}

var es = document.getElementById('empty-state');
new MutationObserver(function() {
  var v = es.classList.contains('visible');
  if (v && !rafId) rafId = requestAnimationFrame(tick);
  else if (!v && rafId) { cancelAnimationFrame(rafId); rafId = null; }
}).observe(es, {attributes:true});

// ── SERVICES CAROUSEL
var SERVICES = [
  ['Courses Quotidiennes'],
  ['Services Numeriques'],
  ['Mobile Money'],
  ['Ecole & Bureau'],
  ['Jouets & Enfants'],
  ['Bien-Etre'],
  ['Patisserie Maison'],
  ['Qualite & Confiance']
];
var ICONS = ['🛒','💻','📱','📚','🧸','🌿','🍰','🛡️'];
var LABELS = ['Courses Quotidiennes','Services Numériques','Mobile Money','École & Bureau','Jouets & Enfants','Bien-Être','Pâtisserie Maison','Qualité & Confiance'];
var swrap = document.getElementById('es-service-wrap');
if (swrap) {
  var srvEls = LABELS.map(function(label, i) {
    var d = document.createElement('div');
    d.className = 'es-service';
    d.innerHTML = '<span style="font-size:28px;line-height:1">' + ICONS[i] + '</span><span>' + label + '</span>';
    swrap.appendChild(d);
    return d;
  });
  var srvIdx = 0;
  srvEls[0].classList.add('active');
  setInterval(function() {
    srvEls[srvIdx].classList.remove('active');
    srvIdx = (srvIdx + 1) % srvEls.length;
    srvEls[srvIdx].classList.add('active');
  }, 3200);
}

// ── HORLOGE
var clockEl = document.getElementById('es-clock');
var sidEl = document.getElementById('es-screen-id');
try { if (sidEl && typeof SCREEN_ID !== 'undefined') sidEl.textContent = 'ÉCRAN ' + SCREEN_ID; } catch(e) {}
function tick_clock() {
  if (!clockEl) return;
  var d = new Date();
  clockEl.textContent = ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
}
tick_clock();
setInterval(tick_clock, 5000);

}); // DOMContentLoaded
</script>
</body>
